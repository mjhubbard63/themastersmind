<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Master's Mind - Screening Application</title>
    <!-- Google Fonts for professional typography -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #1a1a1a;
            color: #333333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: #ffffff;
            max-width: 550px;
            width: 100%;
            padding: 40px 30px;
            border-radius: 4px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            text-align: center;
        }
        h1 {
            font-weight: 800;
            font-size: 26px;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .badge {
            background-color: #1a1a1a;
            color: #ffffff;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            padding: 6px 16px;
            text-transform: uppercase;
            display: inline-block;
            margin-bottom: 25px;
        }
        .instructions {
            font-size: 13px;
            line-height: 1.6;
            color: #666666;
            margin-bottom: 30px;
        }
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 700;
            font-size: 12px;
            margin-bottom: 8px;
        }
        input[type="text"],
        input[type="email"],
        select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            background-color: #f9f9f9;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #1a1a1a;
            background-color: #ffffff;
        }
        .checkbox-group {
            display: flex;
            align-items: flex-start;
            text-align: left;
            margin: 25px 0;
        }
        .checkbox-group input {
            margin-top: 3px;
            margin-right: 12px;
            cursor: pointer;
        }
        .checkbox-group label {
            font-weight: 400;
            font-size: 11px;
            line-height: 1.5;
            color: #444444;
            cursor: pointer;
        }
        .submit-btn {
            background-color: #d32f2f;
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 15px;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        .submit-btn:hover {
            background-color: #b71c1c;
        }
        /* Anti-Bot Honeypot Styling (Visually Hidden) */
        .security-perimeter-trap {
            display: none !important;
            visibility: hidden !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>The Master's Mind</h1>
        <div class="badge">Private Security Perimeter</div>
        
        <p class="instructions">
            Access to this sovereign infrastructure is strictly by invitation or verified credentials. 
            Complete the screening protocol below to submit an access authorization request.
        </p>

        <form id="screeningForm" onsubmit="return validateApplication(event)">
            
            <!-- Honeypot Field Container -->
            <div class="security-perimeter-trap" aria-hidden="true">
                <label for="verification_bypass">Leave this system field empty:</label>
                <input type="text" id="verification_bypass" name="verification_bypass" autocomplete="off" tabindex="-1">
            </div>

            <div class="form-group">
                <label for="fullName">First & Last Name</label>
                <input type="text" id="fullName" required>
            </div>

            <div class="form-group">
                <label for="email">Verified Email Address</label>
                <input type="email" id="email" required>
            </div>

            <div class="form-group">
                <label for="zipCode">Current Zip Code</label>
                <input type="text" id="zipCode" required pattern="[0-9]{5}" title="Please enter a valid 5-digit zip code">
            </div>

            <div class="form-group">
                <label for="sponsor">Referring Sponsor Name</label>
                <input type="text" id="sponsor" placeholder="Leave blank if none">
            </div>

            <div class="form-group">
                <label for="objective">Core Purpose Evaluation Track</label>
                <select id="objective" required>
                    <option value="" disabled selected>Select your objective...</option>
                    <!-- Options can be populated later -->
                </select>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="agreement" required>
                <label for="agreement">
                    I explicitly agree to execute the unalterable system templates and duplication parameters with zero adjustments to preserve complete organizational professionalism.
                </label>
            </div>

            <button type="submit" class="submit-btn">Transmit Screening Application &rarr;</button>
        </form>
    </div>

    <script>
        function validateApplication(event) {
            // Stop the form from submitting automatically
            event.preventDefault();

            // 1. Honeypot Check (Security Verification)
            const botTrap = document.getElementById('verification_bypass').value;
            if (botTrap !== "") {
                console.warn("Security Alert: Automated entity detected. Transmission aborted.");
                alert("Application processing error. Please refresh and try again.");
                return false;
            }

            // 2. Normal validation check
            const name = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            
            console.log("Security clearance passed for: " + name);
            alert("Application data captured securely! Next, we will connect this to your backend service.");
            
            return true;
        }
    </script>

</body>
</html>
